[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-face-comparison"
version = "0.1.0"
description = "Offline cross-platform camera face comparison desktop application"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "insightface>=0.7.3,<2",
    "numpy>=1.26,<3",
    "opencv-python>=4.10,<6",
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
cpu = [
    "onnxruntime>=1.20,<2",
]
gpu = [
    "onnxruntime-gpu>=1.20,<2",
    "nvidia-cuda-runtime>=13,<14; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "nvidia-cublas>=13,<14; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "nvidia-curand>=10,<11; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu13>=9,<10; platform_system == 'Linux' and platform_machine == 'x86_64'",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]
evaluation = [
    "scipy>=1.13,<2",
]

[project.scripts]
camera-face-comparison = "camera_face_comparison.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests/application", "experiments/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["src"]
